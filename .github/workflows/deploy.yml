name: Deploy

on:
  workflow_dispatch:


jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version-file: ".python-version"

    - name: Install uv
      uses: astral-sh/setup-uv@v8.1.0
      with:
          version: "0.9.2"

    - name: Install the project
      run: |
        uv sync

    - name: Run unit tests
      run: |
        uv run pytest


    # Export a legacy requirements file for App Engine
    - name: Export requirements.txt
      run: |
        uv export > requirements.txt

    - name: Upload requirements.txt
      uses: actions/upload-artifact@v7
      with:
        name: requirements_exports
        path: requirements.txt


  deploy:
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: webhost-common
          workload_identity_provider: projects/232474345248/locations/global/workloadIdentityPools/github-actions-deploy/providers/github
          service_account: ci-deploy@webhost-common.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: webhost-common

      - name: Download requirements.txt
        uses: actions/download-artifact@v8
        with:
          name: requirements_exports

      - name: Deploy App Engine service
        run: gcloud app deploy


      - name: Build background job image
        run: |
          cp Dockerfile.jobs Dockerfile 
          gcloud builds submit \
            --region europe-north1 \
            --tag europe-north1-docker.pkg.dev/webhost-common/common/ntm-bg-job

      - name: Deploy background jobs
        run: |
          gcloud run jobs deploy ntm-parse-movie \
              --image europe-north1-docker.pkg.dev/webhost-common/common/ntm-bg-job \
              --region europe-north1 \
              --max-retries 0 \
              --set-env-vars ENV=prod \
              --set-secrets OPENAI_API_KEY=not-that-movie-open-ai-api-key:1 \
              --args=--type,movie,--batch_size,1 \
              --service-account not-that-movie-worker@webhost-common.iam.gserviceaccount.com

          gcloud run jobs deploy ntm-parse-person \
              --image europe-north1-docker.pkg.dev/webhost-common/common/ntm-bg-job \
              --region europe-north1 \
              --max-retries 0 \
              --set-env-vars ENV=prod \
              --set-secrets OPENAI_API_KEY=not-that-movie-open-ai-api-key:1 \
              --args=--type,person,--batch_size,1 \
              --service-account not-that-movie-worker@webhost-common.iam.gserviceaccount.com